[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "tyvrana-core"
version = "0.0.0"
description = "Local orchestration and adapter connections for Tyvrana."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4.15.1",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "tyvrana-protocol @ git+https://github.com/tyvrana/tyvrana-protocol.git@ba623d22555dff46e1d8a7a6b3a01417bf584136",
    "websockets>=16.0",
]

[project.scripts]
tyvrana-core = "tyvrana_core.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.7",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tyvrana_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_debug = true
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Operation deadlines also trigger wire cancellation and a typed timeout error.
ignore = ["ASYNC109"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
